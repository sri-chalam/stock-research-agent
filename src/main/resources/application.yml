spring:
  application:
    name: stock-research-agent
  threads:
    virtual:
      enabled: true

# Model IDs are configured per agent here, never hard-coded. The API key comes from the
# ANTHROPIC_API_KEY environment variable.
stock-agent:
  agents:
    quote:
      model: claude-haiku-5-5
      max-tokens: 1024
      temperature: 0.0
      timeout: 30s
      max-steps: 4
