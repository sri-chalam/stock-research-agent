spring:
  application:
    name: agent-app
  config:
    import: classpath:common.yml
  # OAuth2 resource server (SEC-2): standard properties only. WorkOS access tokens have no aud claim,
  # so no audience is checked; SecurityConfig requires the agent.chat permission on /api/**.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Copied exactly from a real token's iss: https://api.workos.com/user_management/<client_id>
          issuer-uri: ${WORKOS_ISSUER_URI}
          # Set explicitly, so startup needs no OIDC discovery call to the issuer.
          jwk-set-uri: ${WORKOS_JWK_SET_URI}
          # WorkOS puts permissions in a "permissions" array; each becomes a SCOPE_<permission> authority.
          authorities-claim-name: permissions

server:
  port: 8080
  address: 127.0.0.1

# Model IDs are configured per agent here, never hard-coded. The API key comes from the
# ANTHROPIC_API_KEY environment variable.
stock-agent:
  agents:
    # Plans each request, delegates sub-questions to the specialist agents below and merges their
    # answers. max-steps caps the specialist invocations per request. The planner writes the final
    # merged answer inside its "done" JSON, so max-tokens must exceed the specialists' combined
    # output; a truncated "done" JSON fails to parse and the request returns 500.
    supervisor:
      model: claude-haiku-5-5
      max-tokens: 4096
      timeout: 30s
      max-steps: 4
    market-data:
      model: claude-haiku-5-5
      max-tokens: 1024
      timeout: 30s
      max-steps: 4
      # MCP tools this agent may see and call. An empty list means no tools.
      allowed-tools:
        - getQuote
        - getCompanyProfile
        - getCompanyNews
        - getMarketNews
        - getEarningsCalendar
        - getBasicFinancials
    # The Filings analyst.
    filings:
      model: claude-haiku-5-5
      max-tokens: 1024
      timeout: 30s
      max-steps: 4
      allowed-tools:
        - listFilings
        - getCompanyFacts
        - searchFilings
    # Reads the user's holdings and watchlist. The user comes from the forwarded token's sub.
    portfolio:
      model: claude-haiku-5-5
      max-tokens: 1024
      timeout: 30s
      max-steps: 4
      allowed-tools:
        - getHoldings
        - getWatchlist
  # The prompt classifier: one LLM call per /api/chat prompt, before the Supervisor, returning the
  # prompt's freshness class (REAL_TIME or CACHEABLE) and tickers. Not an agent: no tools, no memory.
  # The prompt is read from prompts/<prompt-id>.txt.
  classifier:
    model: claude-haiku-5-5
    prompt-id: classifier-v1
    max-tokens: 256
    timeout: 10s
  # Answers CACHEABLE prompts from earlier answers to similar questions with the same ticker set.
  semantic-cache:
    enabled: true
    # Lowest cosine similarity between bge-small embeddings that counts as a hit. Set from
    # SemanticCacheThresholdCalibrationTest, which fails when a calibration pair falls on the
    # wrong side of it.
    similarity-threshold: 0.87
    # One TTL for every stored answer. Expired rows are never deleted.
    ttl: 1h
    # jdbc (Postgres, see docker-compose.yml) or in-memory (empty on every start; for tests).
    store: jdbc
    # The jdbc store's Postgres user, whose search_path is the sem_cache schema. The password comes
    # from the SEM_CACHE_DB_PASSWORD environment variable; startup fails when Postgres is unreachable.
    database:
      host: ${SEM_CACHE_DB_HOST:localhost}
      port: ${SEM_CACHE_DB_PORT:5432}
      name: ${SEM_CACHE_DB_NAME:stockagent}
      user: ${SEM_CACHE_DB_USER:sem_cache}
  # MCP servers the agents reach through the LangChain4j MCP client. The agent app fails to start
  # when any of them is unreachable, so start market-data-mcp, filings-mcp and portfolio-mcp first.
  mcp-servers:
    market-data:
      url: ${MARKET_DATA_MCP_URL:http://localhost:8081/mcp}
      # Pinned so the client skips the server/discover probe, which our servers do not answer.
      protocol-version: 2025-11-25
      tool-execution-timeout: 10s
    filings:
      url: ${FILINGS_MCP_URL:http://localhost:8082/mcp}
      protocol-version: 2025-11-25
      tool-execution-timeout: 10s
    portfolio:
      url: ${PORTFOLIO_MCP_URL:http://localhost:8084/mcp}
      protocol-version: 2025-11-25
      tool-execution-timeout: 10s
