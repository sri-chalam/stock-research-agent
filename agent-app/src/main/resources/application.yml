spring:
  application:
    name: stock-research-agent
  config:
    import: classpath:common.yml

server:
  port: 8080
  address: 127.0.0.1

# Model IDs are configured per agent here, never hard-coded. The API key comes from the
# ANTHROPIC_API_KEY environment variable.
stock-agent:
  agents:
    quote:
      model: claude-haiku-5-5
      max-tokens: 1024
      timeout: 30s
      max-steps: 4
