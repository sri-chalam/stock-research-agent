spring:
  application:
    name: agent-app
  config:
    import: classpath:common.yml

server:
  port: 8080
  address: 127.0.0.1

# Model IDs are configured per agent here, never hard-coded. The API key comes from the
# ANTHROPIC_API_KEY environment variable.
stock-agent:
  agents:
    # Plans each request, delegates sub-questions to the specialist agents below and merges their
    # answers. max-steps caps the specialist invocations per request. The planner writes the final
    # merged answer inside its "done" JSON, so max-tokens must exceed the specialists' combined
    # output; a truncated "done" JSON fails to parse and the request returns 500.
    supervisor:
      model: claude-haiku-5-5
      max-tokens: 4096
      timeout: 30s
      max-steps: 4
    market-data:
      model: claude-haiku-5-5
      max-tokens: 1024
      timeout: 30s
      max-steps: 4
      # MCP tools this agent may see and call. An empty list means no tools.
      allowed-tools:
        - getQuote
        - getCompanyProfile
        - getCompanyNews
        - getMarketNews
        - getEarningsCalendar
        - getBasicFinancials
    # The Filings analyst.
    filings:
      model: claude-haiku-5-5
      max-tokens: 1024
      timeout: 30s
      max-steps: 4
      allowed-tools:
        - listFilings
        - getCompanyFacts
        - searchFilings
    # Reads the user's holdings and watchlist. The user comes from X-User-Id on the MCP call.
    portfolio:
      model: claude-haiku-5-5
      max-tokens: 1024
      timeout: 30s
      max-steps: 4
      allowed-tools:
        - getHoldings
        - getWatchlist
  # MCP servers the agents reach through the LangChain4j MCP client. The agent app fails to start
  # when any of them is unreachable, so start market-data-mcp, filings-mcp and portfolio-mcp first.
  mcp-servers:
    market-data:
      url: ${MARKET_DATA_MCP_URL:http://localhost:8081/mcp}
      # Pinned so the client skips the server/discover probe, which our servers do not answer.
      protocol-version: 2025-11-25
      tool-execution-timeout: 10s
    filings:
      url: ${FILINGS_MCP_URL:http://localhost:8082/mcp}
      protocol-version: 2025-11-25
      tool-execution-timeout: 10s
    # The only server that receives the chat user's X-User-Id.
    portfolio:
      url: ${PORTFOLIO_MCP_URL:http://localhost:8084/mcp}
      protocol-version: 2025-11-25
      tool-execution-timeout: 10s
