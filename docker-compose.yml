# Local stack: `docker compose build --pull && docker compose up` (`--pull`: ADR 0012). Keys come from the git-ignored .env (copy .env.example).
# Host ports are bound to 127.0.0.1 only. Inside the containers the apps listen on 0.0.0.0 so Compose networking and
# the port bindings can reach them. agent-app and the three MCP servers validate WorkOS tokens (WORKOS_* in .env).
services:
  # One Postgres + pgvector for the project, one schema per app (initdb/ creates them). The
  # database is disposable: `docker compose down` drops it and filings-mcp re-ingests on startup.
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: stockagent
      POSTGRES_USER: postgres
      # Local-dev defaults; override them in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-dev}
      FILINGS_DB_PASSWORD: ${FILINGS_DB_PASSWORD:-filings-local-dev}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:-portfolio-local-dev}
      SEM_CACHE_DB_PASSWORD: ${SEM_CACHE_DB_PASSWORD:-sem-cache-local-dev}
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "stockagent"]
      interval: 5s
      timeout: 3s
      retries: 12

  market-data-mcp:
    build:
      context: .
      dockerfile: market-data-mcp/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      # Only this service gets the Finnhub key (MCP-1).
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:?set FINNHUB_API_KEY in .env}
      WORKOS_ISSUER_URI: ${WORKOS_ISSUER_URI:?set WORKOS_ISSUER_URI in .env}
      WORKOS_JWK_SET_URI: ${WORKOS_JWK_SET_URI:?set WORKOS_JWK_SET_URI in .env}
      # Tracing (ADR 0013): the shared agent config; service.name is the compose service name.
      OTEL_CONFIG_FILE: /etc/otel/otel-config.yaml
      OTEL_SERVICE_NAME: market-data-mcp
    volumes:
      - ./docker/otel/otel-config.yaml:/etc/otel/otel-config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  filings-mcp:
    build:
      context: .
      dockerfile: filings-mcp/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      # SEC EDGAR requires a User-Agent with contact details; only this service gets it.
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in .env}
      FILINGS_DB_HOST: postgres
      FILINGS_DB_PASSWORD: ${FILINGS_DB_PASSWORD:-filings-local-dev}
      WORKOS_ISSUER_URI: ${WORKOS_ISSUER_URI:?set WORKOS_ISSUER_URI in .env}
      WORKOS_JWK_SET_URI: ${WORKOS_JWK_SET_URI:?set WORKOS_JWK_SET_URI in .env}
      # Tracing (ADR 0013): the shared agent config; service.name is the compose service name.
      OTEL_CONFIG_FILE: /etc/otel/otel-config.yaml
      OTEL_SERVICE_NAME: filings-mcp
    volumes:
      - ./docker/otel/otel-config.yaml:/etc/otel/otel-config.yaml:ro
    # filings-mcp fails to start when Postgres is unreachable.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The filings-mcp image is Amazon Linux, which has curl but no wget.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  portfolio-mcp:
    build:
      context: .
      dockerfile: portfolio-mcp/Dockerfile
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORTFOLIO_DB_HOST: postgres
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:-portfolio-local-dev}
      WORKOS_ISSUER_URI: ${WORKOS_ISSUER_URI:?set WORKOS_ISSUER_URI in .env}
      WORKOS_JWK_SET_URI: ${WORKOS_JWK_SET_URI:?set WORKOS_JWK_SET_URI in .env}
      WORKOS_DEMO_USER_1_SUB: ${WORKOS_DEMO_USER_1_SUB:?set WORKOS_DEMO_USER_1_SUB in .env}
      WORKOS_DEMO_USER_2_SUB: ${WORKOS_DEMO_USER_2_SUB:?set WORKOS_DEMO_USER_2_SUB in .env}
      CLAUDE_TEST_USER_1_SUB: ${CLAUDE_TEST_USER_1_SUB:-}
      CLAUDE_TEST_USER_2_SUB: ${CLAUDE_TEST_USER_2_SUB:-}
      # Tracing (ADR 0013): the shared agent config; service.name is the compose service name.
      OTEL_CONFIG_FILE: /etc/otel/otel-config.yaml
      OTEL_SERVICE_NAME: portfolio-mcp
    volumes:
      - ./docker/otel/otel-config.yaml:/etc/otel/otel-config.yaml:ro
    # portfolio-mcp fails to start when Postgres is unreachable (schema.sql runs on startup).
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  agent-app:
    build:
      context: .
      dockerfile: agent-app/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      STOCK_AGENT_MCP_SERVERS_MARKET_DATA_URL: http://market-data-mcp:8081/mcp
      STOCK_AGENT_MCP_SERVERS_FILINGS_URL: http://filings-mcp:8082/mcp
      STOCK_AGENT_MCP_SERVERS_PORTFOLIO_URL: http://portfolio-mcp:8084/mcp
      # Only this service gets the Anthropic key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      SEM_CACHE_DB_HOST: postgres
      SEM_CACHE_DB_PASSWORD: ${SEM_CACHE_DB_PASSWORD:-sem-cache-local-dev}
      WORKOS_ISSUER_URI: ${WORKOS_ISSUER_URI:?set WORKOS_ISSUER_URI in .env}
      WORKOS_JWK_SET_URI: ${WORKOS_JWK_SET_URI:?set WORKOS_JWK_SET_URI in .env}
      # The chat page's sign-in (public Client ID). Empty: the page shows a setup error.
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      # Tracing (ADR 0013): the shared agent config; service.name is the compose service name.
      OTEL_CONFIG_FILE: /etc/otel/otel-config.yaml
      OTEL_SERVICE_NAME: agent-app
    volumes:
      - ./docker/otel/otel-config.yaml:/etc/otel/otel-config.yaml:ro
    # agent-app fails to start when Postgres (semantic cache) or any MCP server is unreachable.
    depends_on:
      postgres:
        condition: service_healthy
      market-data-mcp:
        condition: service_healthy
      filings-mcp:
        condition: service_healthy
      portfolio-mcp:
        condition: service_healthy

  # Log search (ADR 0011): Alloy ships every container's stdout to Loki; Grafana queries Loki.
  # Loki has no volume, so `docker compose down` wipes the logs.
  loki:
    image: grafana/loki:3.7.10

  alloy:
    image: grafana/alloy:v1.21.3
    environment:
      # Alloy collects only this project's containers.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # Tracing (ADR 0013): the apps export OTLP/HTTP straight to tempo:4318; Grafana queries tempo:3200.
  # No published ports and no volume, like Loki: `docker compose down` wipes the traces.
  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Local only: anonymous Admin, no login form. The port is bound to 127.0.0.1.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - tempo
