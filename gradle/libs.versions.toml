[versions]
spring-boot = "4.1.2"
spotless = "8.10.4"
langchain4j = "1.23.0"
# langchain4j-agentic and langchain4j-mcp are beta and not managed by the BOM: pin exact versions.
langchain4j-beta = "1.23.0-beta33"
# OpenTelemetry Java agent (ADR 0013), in the Docker images only. The declarative config format in
# docker/otel/otel-config.yaml is tied to this version. The API version is the one the agent is built
# on (its instrumentation BOM), newer than the one the Spring Boot BOM manages.
opentelemetry-javaagent = "2.33.1"
opentelemetry-api = "1.67.0"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Connection pool for filings-mcp's pgvector store; version managed by the Spring Boot BOM.
hikaricp = { module = "com.zaxxer:HikariCP" }
# portfolio-mcp's store: JdbcClient over Postgres, H2 (PostgreSQL mode) in tests; versions managed by
# the Spring Boot BOM.
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2" }
# agent-app's semantic cache: JdbcClient over its own Hikari pool, without Boot's DataSource
# auto-configuration; version managed by the Spring Boot BOM.
spring-jdbc = { module = "org.springframework:spring-jdbc" }
# Iteration 5: agent-app and the MCP servers are OAuth2 resource servers (WorkOS tokens). The starter
# also brings Nimbus JOSE, which common's TestJwts uses to sign test tokens. Versions managed by the
# Spring Boot BOM.
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-test = { module = "org.springframework:spring-test" }

langchain4j-bom = { module = "dev.langchain4j:langchain4j-bom", version.ref = "langchain4j" }
langchain4j = { module = "dev.langchain4j:langchain4j" }
langchain4j-anthropic = { module = "dev.langchain4j:langchain4j-anthropic" }
langchain4j-agentic = { module = "dev.langchain4j:langchain4j-agentic", version.ref = "langchain4j-beta" }
langchain4j-mcp = { module = "dev.langchain4j:langchain4j-mcp", version.ref = "langchain4j-beta" }
# Community module; ships only a stdio transport, so market-data-mcp wraps it in a Spring MVC controller.
langchain4j-community-mcp-server = { module = "dev.langchain4j:langchain4j-community-mcp-server", version.ref = "langchain4j-beta" }
# filings-mcp RAG. Beta modules, but their versions are managed by the langchain4j BOM.
langchain4j-pgvector = { module = "dev.langchain4j:langchain4j-pgvector" }
langchain4j-embeddings-bge-small-en-v15-q = { module = "dev.langchain4j:langchain4j-embeddings-bge-small-en-v15-q" }
langchain4j-document-transformer-jsoup = { module = "dev.langchain4j:langchain4j-document-transformer-jsoup" }

# Tracing (ADR 0013): the agent jar is copied into the images by stockagent.spring-app's
# copyOtelJavaagent task; the API and annotations are for manual spans.
opentelemetry-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry-javaagent" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry-api" }
opentelemetry-instrumentation-annotations = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations", version.ref = "opentelemetry-javaagent" }

# Gradle plugins used by the buildSrc convention plugins.
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[bundles]
langchain4j = ["langchain4j", "langchain4j-anthropic", "langchain4j-agentic", "langchain4j-mcp"]

