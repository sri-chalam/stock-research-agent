spring:
  application:
    name: portfolio-mcp
  config:
    import: classpath:common.yml
  # Postgres from docker-compose.yml, as the portfolio_mcp user, whose search_path is the portfolio
  # schema. The password comes from the PORTFOLIO_DB_PASSWORD environment variable.
  datasource:
    url: jdbc:postgresql://${PORTFOLIO_DB_HOST:localhost}:${PORTFOLIO_DB_PORT:5432}/${PORTFOLIO_DB_NAME:stockagent}
    username: ${PORTFOLIO_DB_USER:portfolio_mcp}
    password: ${PORTFOLIO_DB_PASSWORD}
  # schema.sql runs on every start and is idempotent; DemoPortfolioSeeder then seeds the demo users.
  sql:
    init:
      mode: always
  # OAuth2 resource server (SEC-2): standard properties only. WorkOS access tokens have no aud claim,
  # so no audience is checked; McpController requires the portfolio.read permission instead.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Copied exactly from a real token's iss: https://api.workos.com/user_management/<client_id>
          issuer-uri: ${WORKOS_ISSUER_URI}
          # Set explicitly, so startup needs no OIDC discovery call to the issuer.
          jwk-set-uri: ${WORKOS_JWK_SET_URI}
          # WorkOS puts permissions in a "permissions" array; each becomes a SCOPE_<permission> authority.
          authorities-claim-name: permissions

# Demo users' WorkOS sub values (user_...), seeded with synthetic portfolios on startup.
stock-agent:
  demo-users:
    user-1-sub: ${WORKOS_DEMO_USER_1_SUB}
    user-2-sub: ${WORKOS_DEMO_USER_2_SUB}
    # Optional WorkOS test users that Claude signs in as; blank values are not seeded.
    claude-test-user-1-sub: ${CLAUDE_TEST_USER_1_SUB:}
    claude-test-user-2-sub: ${CLAUDE_TEST_USER_2_SUB:}

server:
  port: 8084
  address: 127.0.0.1

# Only /actuator/health is exposed; Docker Compose uses it as the healthcheck.
management:
  endpoints:
    web:
      exposure:
        include: health
