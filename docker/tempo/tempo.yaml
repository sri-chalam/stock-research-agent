# Single-binary Tempo for local tracing (ADR 0013). The apps export OTLP/HTTP to tempo:4318; Grafana
# queries tempo:3200. No volume: `docker compose down` wipes the traces.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
